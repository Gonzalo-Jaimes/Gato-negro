services:
  gato-negro-bot:
    build: .
    container_name: bcb-bot-container
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    # Sin volumen de código: la imagen trae todo lo necesario, así que el contenedor
    # funciona sin importar dónde esté la carpeta del proyecto.
    # Para aplicar cambios de código:  docker compose up -d --build
    environment:
      # Este host permite que el contenedor hable con tu Windows local (Ollama)
      - OLLAMA_HOST=http://host.docker.internal:11434
